[build]
builder = "DOCKERFILE"
dockerfilePath = "bt-network-api/Dockerfile"

[deploy]
startCommand = "cd bt-network-api && uv run uvicorn --factory --app-dir . bt_network_api.app:create_app --host 0.0.0.0 --port ${PORT:-8091}"
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
