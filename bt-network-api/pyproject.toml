[build-system]
requires = ["setuptools>=78.1.1"]
build-backend = "setuptools.build_meta"

[project]
name = "bt-network-api"
version = "0.3.0"
description = "FastAPI REST service exposing Bittensor network data via the Bittensor SDK, with persistent caching, API-key auth, and per-key query tracking"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = { file = "LICENSE" }
dependencies = [
    "bittensor>=10.5.0,<11.0",
    "fastapi>=0.110.1",
    "uvicorn",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "ruff>=0.15.12",
    "mypy>=1.20.2",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
]

[project.scripts]
bt-network-api = "bt_network_api.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82", "F401"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
